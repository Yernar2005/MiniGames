<div class="auth-dialog__backdrop" data-auth-backdrop></div>

<div class="auth-dialog__panel" role="dialog" aria-modal="true" aria-labelledby="auth-dialog-title">
  <button class="auth-dialog__close" type="button" aria-label="Закрыть" data-auth-close>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>

  <div class="auth-dialog__tabs" role="tablist">
    <button class="auth-dialog__tab auth-dialog__tab--active" type="button" role="tab" aria-selected="true" data-auth-tab="login">
      Login
    </button>
    <button class="auth-dialog__tab" type="button" role="tab" aria-selected="false" data-auth-tab="register">
      Register
    </button>
  </div>


  <div class="auth-dialog__content" data-auth-content="login">
    <h2 class="auth-dialog__title" id="auth-dialog-title">Welcome Back!</h2>
    <p class="auth-dialog__subtitle">Sign in to resume your games and progress.</p>

    <form class="auth-form" data-auth-form="login" novalidate>
      <div class="auth-form__field">
        <label class="auth-form__label" for="login-email">Email Address</label>
        <div class="auth-form__input-wrap">
          <svg class="auth-form__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 6.5C3 5.67 3.67 5 4.5 5H19.5C20.33 5 21 5.67 21 6.5V17.5C21 18.33 20.33 19 19.5 19H4.5C3.67 19 3 18.33 3 17.5V6.5Z" stroke="currentColor" stroke-width="1.5" />
            <path d="M4 6.5L12 12.5L20 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <input class="auth-form__input" type="email" id="login-email" name="email" placeholder="e.g. alex@minigames.com" autocomplete="email" />
        </div>
      </div>

      <div class="auth-form__field">
        <label class="auth-form__label" for="login-password">Password</label>
        <div class="auth-form__input-wrap">
          <svg class="auth-form__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5" />
            <path d="M8 10V7C8 4.79 9.79 3 12 3C14.21 3 16 4.79 16 7V10" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <input class="auth-form__input" type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password" />
          <button class="auth-form__toggle-visibility" type="button" aria-label="Показать пароль" data-toggle-password>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M1 12C1 12 5 5 12 5C19 5 23 12 23 12C23 12 19 19 12 19C5 19 1 12 1 12Z" stroke="currentColor" stroke-width="1.5" />
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" />
            </svg>
          </button>
        </div>
      </div>

      <a href="/forgot-password" class="auth-form__forgot">Forgot Password?</a>

      <button class="auth-form__submit btn btn--primary" type="submit">Login</button>
    </form>

    <div class="auth-dialog__divider"><span>OR</span></div>

    <button class="auth-dialog__google" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.88c2.27-2.09 3.57-5.17 3.57-8.82Z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.88-3a7.19 7.19 0 0 1-10.72-3.79H1.36v3.09A12 12 0 0 0 12 24Z"/>
        <path fill="#FBBC05" d="M5.35 14.3a7.2 7.2 0 0 1 0-4.6V6.61H1.36a12 12 0 0 0 0 10.78Z"/>
        <path fill="#EA4335" d="M12 4.77c1.76 0 3.35.61 4.6 1.8l3.44-3.44A11.94 11.94 0 0 0 12 0 12 12 0 0 0 1.36 6.61L5.35 9.7A7.16 7.16 0 0 1 12 4.77Z"/>
      </svg>
      Continue with Google
    </button>

    <p class="auth-dialog__switch">
      Don't have an account?
      <button class="auth-dialog__switch-link" type="button" data-auth-tab="register">Register</button>
    </p>
  </div>


  <div class="auth-dialog__content auth-dialog__content--hidden" data-auth-content="register">
    <h2 class="auth-dialog__title">Create Account</h2>
    <p class="auth-dialog__subtitle">Join MiniGames to track your score & streak.</p>

    <form class="auth-form" data-auth-form="register" novalidate>
      <div class="auth-form__field">
        <label class="auth-form__label" for="register-username">Username</label>
        <div class="auth-form__input-wrap">
          <svg class="auth-form__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5" />
            <path d="M4 20C4 16.13 7.58 13 12 13C16.42 13 20 16.13 20 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <input class="auth-form__input" type="text" id="register-username" name="username" placeholder="e.g. CozyGamer_99" autocomplete="username" />
        </div>
      </div>

      <div class="auth-form__field">
        <label class="auth-form__label" for="register-email">Email Address</label>
        <div class="auth-form__input-wrap">
          <svg class="auth-form__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 6.5C3 5.67 3.67 5 4.5 5H19.5C20.33 5 21 5.67 21 6.5V17.5C21 18.33 20.33 19 19.5 19H4.5C3.67 19 3 18.33 3 17.5V6.5Z" stroke="currentColor" stroke-width="1.5" />
            <path d="M4 6.5L12 12.5L20 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <input class="auth-form__input" type="email" id="register-email" name="email" placeholder="your.email@domain.com" autocomplete="email" />
        </div>
      </div>

      <div class="auth-form__field">
        <label class="auth-form__label" for="register-password">Password</label>
        <div class="auth-form__input-wrap">
          <svg class="auth-form__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5" />
            <path d="M8 10V7C8 4.79 9.79 3 12 3C14.21 3 16 4.79 16 7V10" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <input class="auth-form__input" type="password" id="register-password" name="password" placeholder="Min. 8 characters" autocomplete="new-password" />
        </div>
      </div>

      <div class="auth-form__field">
        <label class="auth-form__label" for="register-confirm-password">Confirm Password</label>
        <div class="auth-form__input-wrap">
          <svg class="auth-form__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5" />
            <path d="M8 10V7C8 4.79 9.79 3 12 3C14.21 3 16 4.79 16 7V10" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <input class="auth-form__input" type="password" id="register-confirm-password" name="confirmPassword" placeholder="Repeat your password" autocomplete="new-password" />
        </div>
      </div>

      <button class="auth-form__submit btn btn--primary" type="submit">Create Account</button>
    </form>

    <div class="auth-dialog__divider"><span>OR</span></div>

    <button class="auth-dialog__google" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.88c2.27-2.09 3.57-5.17 3.57-8.82Z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.88-3a7.19 7.19 0 0 1-10.72-3.79H1.36v3.09A12 12 0 0 0 12 24Z"/>
        <path fill="#FBBC05" d="M5.35 14.3a7.2 7.2 0 0 1 0-4.6V6.61H1.36a12 12 0 0 0 0 10.78Z"/>
        <path fill="#EA4335" d="M12 4.77c1.76 0 3.35.61 4.6 1.8l3.44-3.44A11.94 11.94 0 0 0 12 0 12 12 0 0 0 1.36 6.61L5.35 9.7A7.16 7.16 0 0 1 12 4.77Z"/>
      </svg>
      Sign up with Google
    </button>

    <p class="auth-dialog__switch">
      Already have an account?
      <button class="auth-dialog__switch-link" type="button" data-auth-tab="login">Login</button>
    </p>
  </div>
</div>
